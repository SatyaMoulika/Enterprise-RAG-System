services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
      POSTGRES_DB: rag
    volumes:
      - rag_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.12.11
    volumes:
      - rag_models:/root/.ollama
    # Internal only. Use 'docker compose exec ollama ollama pull ...' to load models.
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rag:${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD}@postgres:5432/rag
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen2.5:3b
      EMBEDDING_BACKEND: ollama
      EMBEDDING_MODEL: all-minilm
      EMBEDDING_DIMENSION: 384
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rag_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
volumes:
  rag_postgres:
  rag_models:
  rag_uploads:
