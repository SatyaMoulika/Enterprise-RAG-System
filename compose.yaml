services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
      POSTGRES_DB: rag
    volumes:
      - rag_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:0.12.11
    volumes:
      - rag_models:/root/.ollama
    # Internal only. Use 'docker compose exec ollama ollama pull ...' to load models.
  api:
    build:
      context: ./backend
      args:
        RAG_INSTALL_RERANKING: ${RAG_INSTALL_RERANKING:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://rag:${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD}@postgres:5432/rag
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      OLLAMA_BASE_URL: http://ollama:11434
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost},postgres,ollama"
      no_proxy: "${no_proxy:-127.0.0.1,localhost},postgres,ollama"
      OLLAMA_CHAT_MODEL: qwen2.5:3b
      EMBEDDING_BACKEND: ollama
      EMBEDDING_MODEL: all-minilm
      EMBEDDING_DIMENSION: 384
      RERANKER_MODE: ${RERANKER_MODE:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RETRIEVAL_STRATEGY: ${RETRIEVAL_STRATEGY:-dense}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-20}
      RETRIEVAL_CONTEXT_CHARACTERS: ${RETRIEVAL_CONTEXT_CHARACTERS:-24000}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rag_uploads:/app/uploads
      - rag_reranker_cache:/app/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started
volumes:
  rag_postgres:
  rag_models:
  rag_uploads:
  rag_reranker_cache:
