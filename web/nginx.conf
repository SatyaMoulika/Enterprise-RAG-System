# Per-client ingress limits. Keep Ollama internal; tune these for your deployment.
limit_req_zone $binary_remote_addr zone=rag_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=rag_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rag_chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=rag_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=rag_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Only reverse proxies on private container networks are trusted. In production
    # the sole public entry is Caddy; API/web have no published ports.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 11m;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 130s;

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"detail":"Too many requests. Please wait briefly and try again."}';
    }
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        return 413 '{"detail":"Upload exceeds the server request-size limit."}';
    }
    location /api/auth/ {
        limit_req zone=rag_auth burst=5 nodelay;
        proxy_pass http://api:8000/auth/;
    }
    location = /_authentication {
        internal;
        proxy_pass http://api:8000/users/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/documents/upload {
        auth_request /_authentication;
        limit_req zone=rag_upload burst=2 nodelay;
        limit_conn rag_connections 2;
        proxy_pass http://api:8000/documents/upload;
    }
    location /api/chat/ {
        auth_request /_authentication;
        limit_req zone=rag_chat burst=3 nodelay;
        limit_conn rag_connections 2;
        proxy_pass http://api:8000/chat/;
    }
    location /api/ {
        limit_req zone=rag_api burst=30 nodelay;
        proxy_pass http://api:8000/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
