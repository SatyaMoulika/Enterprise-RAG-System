[project]
name = "enterprise-rag-backend"
version = "0.2.0"
description = "Tenant-scoped document retrieval and grounded answers"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
 "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
 "email-validator>=2.2,<3", "python-jose>=3.4,<4", "argon2-cffi>=23,<26",
 "bcrypt>=4,<5", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "pypdf>=5,<7",
]
[project.optional-dependencies]
legacy-ui = ["streamlit>=1.40,<2", "requests>=2.32,<3"]
local-embeddings = ["sentence-transformers>=3,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
